<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demma Coffee Chat List</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f2;
      color: #2b2b2b;
    }

    .app-container {
      width: 100%;
      min-height: 100vh; /* grows with the list so the whole page scrolls */
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* Black Header Bar (same as home) */
    .top-bar {
      padding: 16px 40px;
      background-color: #2b2b2b;
      color: #ffffff;
      font-family: "Sora", sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    /* Title on top, gray band below (same as mentorship pages) */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .left-side {
      display: flex;
      justify-content: center;
      padding: 32px 40px 24px;
    }

    .right-side {
      flex: 1;
      padding: 28px 40px 110px; /* bottom room for the nav */
      background-color: #f4f4f4;
    }

    .intro {
      max-width: 760px;
      text-align: center;
    }

    .intro-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: "Sora", sans-serif;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #555555;
    }

    /* ----- List of mentor cards ----- */
    .mentor-list {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      list-style: none;
    }

    .list-count {
      max-width: 680px;
      margin: 0 auto 12px;
      font-size: 14px;
      font-weight: 700;
      color: #555555;
    }

    .mentor-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      border: 1.5px solid #2b2b2b;
      border-radius: 18px;
      background-color: #ffffff;
    }

    .avatar {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .mentor-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mentor-name {
      font-size: 17px;
      font-weight: 700;
    }

    .mentor-role {
      font-size: 14px;
      color: #555555;
    }

    .mentor-company {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    .mentor-company svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border: 1.5px solid #2b2b2b;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Nav arrow (same dark circle as match.html) */
    .next-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: #2b2b2b;
      color: #ffffff;
      transition: background-color 0.15s ease;
    }

    .next-btn:hover {
      background-color: #3b3b3b;
    }

    .next-btn svg {
      width: 20px;
      height: 20px;
    }

    .next-btn:focus-visible,
    .pill-btn:focus-visible {
      outline: 3px solid #8a8a8a;
      outline-offset: 2px;
    }

    /* Empty list */
    .empty {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 24px;
      border: 1.5px dashed #8a8a8a;
      border-radius: 18px;
      background-color: #ffffff;
      text-align: center;
    }

    .empty[hidden],
    .list-count[hidden] {
      display: none;
    }

    .empty h2 {
      margin-bottom: 8px;
      font-family: "Sora", sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    .empty p {
      margin-bottom: 16px;
      font-size: 14px;
      color: #555555;
    }

    .pill-btn {
      display: inline-block;
      padding: 10px 20px;
      border: none;
      border-radius: 999px;
      background-color: #2b2b2b;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .pill-btn:hover {
      background-color: #3b3b3b;
    }

    .list-actions {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .list-actions[hidden] {
      display: none;
    }

    /* Bottom Navigation (same floating pill as home) */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: calc(100% - 40px);
      max-width: 480px;
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 10;
      border: 2px solid #2b2b2b;
      border-radius: 999px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0 18px;
      color: #2b2b2b;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .nav-item + .nav-item {
      border-left: 1.5px solid #2b2b2b;
    }

    .nav-item:hover {
      background-color: #f5f5f5;
    }

    .nav-item[aria-current="page"] {
      background-color: #2b2b2b;
      color: #ffffff;
    }

    @media (max-width: 700px) {
      .top-bar,
      .left-side,
      .right-side {
        padding-left: 20px;
        padding-right: 20px;
      }

      .mentor-card {
        padding: 14px;
        gap: 12px;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Black Header Bar -->
    <header class="top-bar">Demma</header>

    <main class="content">
      <!-- Top: title -->
      <div class="left-side">
        <div class="intro">
          <svg class="intro-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 20.5l1.4-5.1A8.5 8.5 0 1 1 21 11.5z"></path>
            <path d="M8.5 10.5h6v2.5a2.5 2.5 0 0 1-2.5 2.5h-1a2.5 2.5 0 0 1-2.5-2.5z"></path>
            <path d="M14.5 11h.8a1.4 1.4 0 0 1 0 2.8h-.8"></path>
            <line x1="10.3" y1="7.2" x2="10.3" y2="8.6"></line>
            <line x1="12.7" y1="7.2" x2="12.7" y2="8.6"></line>
          </svg>
          <h1>Your Coffee Chat List</h1>
          <p class="subtitle">These are the mentors you swiped right on. Tap the arrow on a mentor to keep going.</p>
        </div>
      </div>

      <!-- Bottom: list of approved mentors (filled in by the script) -->
      <div class="right-side">
        <p class="list-count" id="list-count" hidden></p>
        <ul class="mentor-list" id="mentor-list"></ul>

        <!-- Shown when nobody has been swiped right yet -->
        <div class="empty" id="empty" hidden>
          <h2>No mentors yet</h2>
          <p>Swipe right on mentors you'd like to meet and they'll show up here.</p>
          <a href="mentor_swipe.html" class="pill-btn">Find Mentors</a>
        </div>

        <div class="list-actions" id="list-actions" hidden>
          <a href="mentor_swipe.html" class="pill-btn">Keep Swiping</a>
        </div>
      </div>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <!-- Home -->
      <a href="home_student.html" class="nav-item" aria-label="Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"></path>
          <path d="M10 20v-6h4v6"></path>
        </svg>
      </a>

      <!-- Coffee Chat (this section) -->
      <a href="coffee_chat_list.html" class="nav-item" aria-label="Coffee Chats" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 20.5l1.4-5.1A8.5 8.5 0 1 1 21 11.5z"></path>
          <path d="M8.5 10.5h6v2.5a2.5 2.5 0 0 1-2.5 2.5h-1a2.5 2.5 0 0 1-2.5-2.5z"></path>
          <path d="M14.5 11h.8a1.4 1.4 0 0 1 0 2.8h-.8"></path>
          <line x1="10.3" y1="7.2" x2="10.3" y2="8.6"></line>
          <line x1="12.7" y1="7.2" x2="12.7" y2="8.6"></line>
        </svg>
      </a>

      <!-- Posts -->
      <a href="post.html" class="nav-item" aria-label="Posts">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"></rect>
          <line x1="8" y1="8" x2="16" y2="8"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="16" x2="13" y2="16"></line>
        </svg>
      </a>

      <!-- Profile -->
      <a href="#" class="nav-item" aria-label="Profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <circle cx="12" cy="9.5" r="2.8"></circle>
          <path d="M7 18.2c1.1-2.3 2.9-3.4 5-3.4s3.9 1.1 5 3.4"></path>
        </svg>
      </a>
    </nav>
  </div>

  <script src="mentors_data.js"></script>
  <script>
    // Where each mentor's arrow goes. "?id=" tells that page which mentor was tapped.
    // TODO: change "#" to the next page once it exists (e.g. "coffee_chat_mentor.html").
    const NEXT_PAGE = "#";

    // Swipes saved by mentor_swipe.html: { mentorId: "chat" | "pass" }
    const DECISIONS_KEY = "demma-coffee-chat-swipes";

    function loadDecisions() {
      try { return JSON.parse(localStorage.getItem(DECISIONS_KEY)) || {}; }
      catch (e) { return {}; }
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    const AVATAR = '<svg class="avatar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><circle cx="12" cy="9.5" r="2.8"></circle><path d="M7 18.2c1.1-2.3 2.9-3.4 5-3.4s3.9 1.1 5 3.4"></path></svg>';
    const BUILDING = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5"></rect><line x1="9" y1="7" x2="9" y2="7.01"></line><line x1="15" y1="7" x2="15" y2="7.01"></line><line x1="9" y1="11" x2="9" y2="11.01"></line><line x1="15" y1="11" x2="15" y2="11.01"></line><path d="M10 21v-4h4v4"></path></svg>';
    const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>';

    function nextLink(m) {
      return NEXT_PAGE === "#" ? "#" : `${NEXT_PAGE}?id=${encodeURIComponent(m.id)}`;
    }

    function cardHTML(m) {
      return `
        <li class="mentor-card">
          ${AVATAR}
          <div class="mentor-info">
            <span class="mentor-name">${esc(m.name)}</span>
            <span class="mentor-role">${esc(m.role)} · ${esc(m.year)}</span>
            <span class="mentor-company">${BUILDING}${esc(m.company)} · ${m.years} year${m.years === 1 ? "" : "s"}</span>
            <div class="tag-row">${m.careers.map(c => `<span class="tag">${esc(c)}</span>`).join("")}</div>
          </div>
          <a href="${nextLink(m)}" class="next-btn" aria-label="Continue with ${esc(m.name)}">${CHEVRON}</a>
        </li>`;
    }

    const decisions = loadDecisions();
    const approved = MENTORS.filter(m => decisions[m.id] === "chat");

    if (approved.length) {
      document.getElementById("mentor-list").innerHTML = approved.map(cardHTML).join("");
      const count = document.getElementById("list-count");
      count.textContent = `${approved.length} mentor${approved.length === 1 ? "" : "s"} on your list`;
      count.hidden = false;
      document.getElementById("list-actions").hidden = false;
    } else {
      document.getElementById("empty").hidden = false;
    }
  </script>
</body>
</html>
