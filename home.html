<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demma Dashboard - Hi Ricky!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f2;
      color: #2b2b2b;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      border-left: 1px solid #2b2b2b;
      border-right: 1px solid #2b2b2b;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .top-bar {
      padding: 20px 18px 14px;
      border-top: 2px solid #2b2b2b;
      border-bottom: 2px solid #2b2b2b;
    }

    .top-bar h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    /* Main Scrollable Content */
    .content {
      flex: 1;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    /* Welcome Banner */
    .welcome-card {
      border: 1.5px solid #2b2b2b;
      border-radius: 18px;
      padding: 14px 24px;
      text-align: center;
      font-size: 14px;
      line-height: 1.35;
      margin-bottom: 32px;
    }

    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
    }

    /* Action Cards */
    .action-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 34px;
    }

    .action-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 18px;
      border: 1.5px solid #2b2b2b;
      border-radius: 18px;
      background-color: #ffffff;
      text-decoration: none;
      color: #2b2b2b;
      font-size: 15px;
      transition: background-color 0.15s ease;
    }

    .action-card:hover {
      background-color: #fafafa;
    }

    /* Bottom Navigation */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 2px solid #2b2b2b;
      background-color: #ffffff;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0 18px;
      color: #2b2b2b;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .nav-item + .nav-item {
      border-left: 1.5px solid #2b2b2b;
    }

    .nav-item:hover {
      background-color: #f5f5f5;
    }

    .chevron {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="top-bar">
      <h1>Hi Ricky!</h1>
    </header>

    <!-- Main Body -->
    <main class="content">
      <!-- Welcome Banner -->
      <div class="welcome-card">
        Welcome to Demma! Find your mentee today with a simple coffee chat!
      </div>

      <!-- Find Your Future Mentee -->
      <section>
        <div class="section-header">
          <h2 class="section-title">Find Your Future Mentee</h2>
        </div>

        <div class="action-list">
          <a href="#" class="action-card">
            <span>Coffee Chat with a Future Mentee</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </a>

          <a href="#" class="action-card">
            <span>Read to commit to a mentorship</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </a>
        </div>
      </section>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <!-- Home -->
      <a href="#" class="nav-item" aria-label="Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"></path>
          <path d="M10 20v-6h4v6"></path>
        </svg>
      </a>

      <!-- Coffee Chat -->
      <a href="#" class="nav-item" aria-label="Coffee Chats">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-6z"></path>
          <path d="M16 11h2a2.5 2.5 0 0 1 0 5h-2"></path>
          <line x1="7" y1="4" x2="7" y2="6.5"></line>
          <line x1="10" y1="4" x2="10" y2="6.5"></line>
          <line x1="13" y1="4" x2="13" y2="6.5"></line>
        </svg>
      </a>

      <!-- Mentors / Community -->
      <a href="#" class="nav-item" aria-label="Community">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9.5" cy="8.5" r="3.5"></circle>
          <path d="M3.5 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path>
          <path d="M15.5 5.5a3.5 3.5 0 0 1 0 6.5"></path>
          <path d="M17.5 14.5c2 .6 3.5 2.3 3.5 5"></path>
        </svg>
      </a>

      <!-- Profile -->
      <a href="#" class="nav-item" aria-label="Profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <circle cx="12" cy="9.5" r="2.8"></circle>
          <path d="M7 18.2c1.1-2.3 2.9-3.4 5-3.4s3.9 1.1 5 3.4"></path>
        </svg>
      </a>
    </nav>
  </div>
</body>
</html>
