<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumni post</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f4;
      color: #222222;
      min-height: 100vh;
    }

    .desktop-layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Left Sidebar Navigation for Desktop */
    .sidebar-nav {
      width: 240px;
      background-color: #ffffff;
      border-right: 1.5px solid #222222;
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      padding: 0 24px 24px;
      border-bottom: 1.5px solid #222222;
      margin-bottom: 16px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      background: none;
      border: none;
      cursor: pointer;
      color: #222222;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background-color: #f0f0f0;
    }

    /* Main Workspace */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    /* Top App Bar */
    .top-bar {
      display: flex;
      align-items: center;
      padding: 18px 32px;
      border-bottom: 1.5px solid #222222;
      gap: 14px;
      background-color: #ffffff;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      color: #222222;
    }

    .top-bar h1 {
      font-size: 20px;
      font-weight: 600;
      color: #222222;
    }

    /* Centered Full-Width Desktop Container */
    .content-wrapper {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
    }

    /* Author Header */
    .author-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .avatar-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      color: #222222;
    }

    .skeleton-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }

    .skeleton-bar {
      height: 7px;
      background-color: #cccccc;
      border-radius: 999px;
      width: 45%;
    }

    /* Post Box */
    .post-box {
      border: 1.5px solid #222222;
      padding: 20px 22px 56px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: #111111;
      margin-bottom: 24px;
    }

    /* Action Row (Like & Bookmark) */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1.5px solid #222222;
      margin-bottom: 20px;
    }

    .like-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      color: #222222;
      padding: 0;
    }

    .like-skeleton {
      width: 32px;
      height: 7px;
      background-color: #cccccc;
      border-radius: 999px;
    }

    /* Comments Section */
    .comments-heading {
      font-size: 18px;
      font-weight: 600;
      color: #222222;
      margin-bottom: 20px;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    .comment-item {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .comment-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid #222222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #222222;
      flex-shrink: 0;
    }

    /* Comment Input Box */
    .comment-input-wrapper {
      margin-top: auto;
      padding-top: 32px;
    }

    .comment-input-box {
      display: flex;
      align-items: center;
      background-color: #e4e4e4;
      border: 1.5px solid #222222;
      padding: 16px 20px;
    }

    .comment-input-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      color: #222222;
      outline: none;
      width: 100%;
    }

    .comment-input-box input::placeholder {
      color: #666666;
    }

    .post-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      color: #222222;
      padding-left: 16px;
      flex-shrink: 0;
    }

    .post-btn:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="desktop-layout">
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar-nav">
      <div class="brand-title">Demma</div>

      <a href="home.html" class="nav-item" aria-label="Home" style="text-decoration: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"></path>
        </svg>
        <span>Home</span>
        </a>

      <button class="nav-item" aria-label="Coffee Chat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 11h1a3 3 0 0 1 0 6h-1"></path>
          <path d="M5 11h12v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4v-6z"></path>
          <line x1="8" y1="5" x2="8" y2="8"></line>
          <line x1="11" y1="5" x2="11" y2="8"></line>
          <line x1="14" y1="5" x2="14" y2="8"></line>
        </svg>
        <span>Coffee Chats</span>
      </button>

      <button class="nav-item" aria-label="Community">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9.5" cy="8.5" r="3.2"></circle>
          <path d="M4 19.5c0-3.2 2.4-5.5 5.5-5.5s5.5 2.3 5.5 5.5"></path>
          <path d="M14.5 5.6a3.2 3.2 0 0 1 0 5.8"></path>
          <path d="M16.5 14.2c2.3.5 4 2.5 4 5.3"></path>
        </svg>
        <span>Community</span>
      </button>

      <button class="nav-item" aria-label="Profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <circle cx="12" cy="9.5" r="3"></circle>
          <path d="M6.5 19c1.2-2.8 3.2-4 5.5-4s4.3 1.2 5.5 4"></path>
        </svg>
        <span>Profile</span>
      </button>
    </aside>

    <!-- Main Desktop Workspace -->
    <div class="main-area">
      <!-- Top Header -->
      <header class="top-bar">
        <a href="home.html" class="back-btn" aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <h1>Alumni post</h1>
      </header>

      <!-- Post & Comments Container -->
      <main class="content-wrapper">
        <!-- Author Info Placeholder -->
        <div class="author-row">
          <svg class="avatar-icon" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="18" cy="18" r="16"></circle>
            <circle cx="18" cy="13.5" r="5"></circle>
            <path d="M8.5 29.5c2-4.8 5.5-7 9.5-7s7.5 2.2 9.5 7" stroke-linecap="round"></path>
          </svg>
          <div class="skeleton-group">
            <div class="skeleton-bar"></div>
            <div class="skeleton-bar"></div>
          </div>
        </div>

        <!-- Post Content -->
        <div class="post-box">
          Hey guys, there’s BroncoHacks coming up and I am a judge. Comment JOIN, if you want more details on how to join the hackathon[cite: 1]
        </div>

        <!-- Like & Bookmark Bar -->
        <div class="action-row">
          <div class="like-group">
            <button class="icon-btn" id="likeBtn" aria-label="Like">
              <svg id="heartIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
            <div class="like-skeleton"></div>
          </div>

          <button class="icon-btn" id="bookmarkBtn" aria-label="Bookmark">
            <svg id="bookmarkIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>
        </div>

        <!-- Comments -->
        <h2 class="comments-heading">Comments</h2>
        <div class="comment-list" id="commentList"></div>

        <!-- Comment Input -->
        <div class="comment-input-wrapper">
          <form class="comment-input-box" id="commentForm">
            <input type="text" id="commentInput" placeholder="Add a comment..." aria-label="Write a comment" />
            <button type="submit" class="post-btn">Post</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script>
    const likeBtn = document.getElementById('likeBtn');
    const heartIcon = document.getElementById('heartIcon');
    likeBtn.addEventListener('click', () => {
      const liked = heartIcon.getAttribute('fill') === '#e0245e';
      heartIcon.setAttribute('fill', liked ? 'none' : '#e0245e');
      heartIcon.setAttribute('stroke', liked ? 'currentColor' : '#e0245e');
    });

    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const bookmarkIcon = document.getElementById('bookmarkIcon');
    bookmarkBtn.addEventListener('click', () => {
      const saved = bookmarkIcon.getAttribute('fill') === '#222222';
      bookmarkIcon.setAttribute('fill', saved ? 'none' : '#222222');
    });

    const commentForm = document.getElementById('commentForm');
    const commentInput = document.getElementById('commentInput');
    const commentList = document.getElementById('commentList');
    commentForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = commentInput.value.trim();
      if (!text) return;

      const item = document.createElement('div');
      item.className = 'comment-item';
      item.innerHTML = `
        <div class="comment-avatar">U</div>
        <div style="font-size: 15px; color: #222;">${text.replace(/</g, '&lt;')}</div>
      `;
      commentList.appendChild(item);
      commentInput.value = '';
    });
  </script>
</body>
</html>
