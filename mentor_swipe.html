<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demma Mentor Matches</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f2;
      color: #2b2b2b;
    }

    .app-container {
      width: 100%;
      min-height: 100vh; /* grows with the content so the whole page scrolls */
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* Black Header Bar (same as home) */
    .top-bar {
      padding: 16px 40px;
      background-color: #2b2b2b;
      color: #ffffff;
      font-family: "Sora", sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    /* Title on top, gray band below (same as mentorship pages) */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .left-side {
      display: flex;
      justify-content: center;
      padding: 32px 40px 24px;
    }

    .right-side {
      flex: 1;
      padding: 28px 40px 110px; /* bottom room for the nav */
      background-color: #f4f4f4;
    }

    .intro {
      max-width: 760px;
      text-align: center;
    }

    h1 {
      font-family: "Sora", sans-serif;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #555555;
    }

    .subtitle a {
      color: #2b2b2b;
      font-weight: 700;
    }

    /* Deck on the left, coffee chat list on the right */
    .layout {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 24px;
      align-items: start;
    }

    .deck-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .notice {
      width: 100%;
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: #ffffff;
      border: 1.5px dashed #8a8a8a;
      font-size: 13px;
      text-align: center;
      color: #555555;
    }

    .notice[hidden] {
      display: none;
    }

    .notice a {
      color: #2b2b2b;
      font-weight: 700;
    }

    /* ----- Card stack ----- */
    .deck {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 540px;
    }

    .profile-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 22px;
      border: 1.5px solid #2b2b2b;
      border-radius: 18px;
      background-color: #ffffff;
      overflow: hidden;
      user-select: none;
      touch-action: pan-y; /* lets the page still scroll up/down on phones */
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .profile-card.top {
      cursor: grab;
      z-index: 2;
    }

    .profile-card.top.dragging {
      cursor: grabbing;
      transition: none;
    }

    .profile-card.behind {
      z-index: 1;
      transform: translateY(12px) scale(0.95);
      pointer-events: none;
    }

    .profile-card:focus-visible {
      outline: 3px solid #8a8a8a;
      outline-offset: 4px;
    }

    /* "COFFEE CHAT" / "PASS" stamps that fade in while dragging */
    .stamp {
      position: absolute;
      top: 22px;
      padding: 6px 12px;
      border: 2.5px solid #2b2b2b;
      border-radius: 10px;
      background-color: #ffffff;
      font-family: "Sora", sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
    }

    .stamp.yes {
      left: 22px;
      transform: rotate(-12deg);
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .stamp.no {
      right: 22px;
      transform: rotate(12deg);
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .card-name {
      font-family: "Sora", sans-serif;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }

    .card-role {
      font-size: 14px;
      color: #555555;
    }

    /* Company + years worked there */
    .card-company {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
      font-size: 14px;
      font-weight: 700;
    }

    .card-company svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .match-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background-color: #2b2b2b;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }

    .card-bio {
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.45;
    }

    .card-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-section h3 {
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8a8a8a;
    }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 13px;
    }

    .facts strong {
      font-weight: 700;
    }

    /* Tags: dark when it matches your filters */
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-block;
      padding: 5px 11px;
      border: 1.5px solid #2b2b2b;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .tag.match {
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .tag.match::before {
      content: "\2713  ";
    }

    /* Empty deck */
    .deck-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      border: 1.5px dashed #8a8a8a;
      border-radius: 18px;
      background-color: #ffffff;
      text-align: center;
    }

    .deck-empty h2 {
      font-family: "Sora", sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    .deck-empty p {
      font-size: 14px;
      color: #555555;
    }

    /* ----- X / Undo / Check buttons ----- */
    .swipe-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .round-btn {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #2b2b2b;
      border-radius: 50%;
      background-color: #ffffff;
      color: #2b2b2b;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .round-btn:hover {
      background-color: #f1f1f1;
    }

    .round-btn.yes {
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .round-btn.yes:hover {
      background-color: #3b3b3b;
    }

    .round-btn.small {
      width: 44px;
      height: 44px;
    }

    .round-btn svg {
      width: 24px;
      height: 24px;
    }

    .round-btn.small svg {
      width: 18px;
      height: 18px;
    }

    .round-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .round-btn:focus-visible,
    .pill-btn:focus-visible,
    .remove-btn:focus-visible {
      outline: 3px solid #8a8a8a;
      outline-offset: 2px;
    }

    .hint {
      font-size: 13px;
      color: #8a8a8a;
      text-align: center;
    }

    /* ----- Coffee chat list panel ----- */
    .panel {
      padding: 18px;
      border: 1.5px solid #2b2b2b;
      border-radius: 18px;
      background-color: #ffffff;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .panel-title .icon {
      width: 20px;
      height: 20px;
    }

    .panel-note {
      margin-bottom: 12px;
      font-size: 13px;
      color: #555555;
    }

    .chat-list {
      list-style: none;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1.5px solid #e0e0e0;
    }

    .chat-item .avatar {
      width: 32px;
      height: 32px;
    }

    .chat-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-name {
      font-size: 14px;
      font-weight: 700;
    }

    .chat-role {
      font-size: 12px;
      color: #555555;
    }

    .remove-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #2b2b2b;
      border-radius: 50%;
      background-color: #ffffff;
      color: #2b2b2b;
      cursor: pointer;
    }

    .remove-btn:hover {
      background-color: #f1f1f1;
    }

    .remove-btn svg {
      width: 14px;
      height: 14px;
    }

    .chat-empty {
      padding: 10px 0 4px;
      border-top: 1.5px solid #e0e0e0;
      font-size: 13px;
      color: #8a8a8a;
    }

    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .pill-btn {
      display: inline-block;
      padding: 10px 20px;
      border: none;
      border-radius: 999px;
      background-color: #2b2b2b;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .pill-btn:hover {
      background-color: #3b3b3b;
    }

    .pill-btn.outline {
      border: 1.5px solid #2b2b2b;
      background-color: #ffffff;
      color: #2b2b2b;
    }

    .pill-btn.outline:hover {
      background-color: #f1f1f1;
    }

    /* Bottom Navigation (same floating pill as home) */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: calc(100% - 40px);
      max-width: 480px;
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 10;
      border: 2px solid #2b2b2b;
      border-radius: 999px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0 18px;
      color: #2b2b2b;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .nav-item + .nav-item {
      border-left: 1.5px solid #2b2b2b;
    }

    .nav-item:hover {
      background-color: #f5f5f5;
    }

    .nav-item[aria-current="page"] {
      background-color: #2b2b2b;
      color: #ffffff;
    }

    /* Tablets and phones: list goes under the deck */
    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        max-width: 420px;
        width: 100%;
        margin: 0 auto;
      }
    }

    @media (max-width: 700px) {
      .top-bar,
      .left-side,
      .right-side {
        padding-left: 20px;
        padding-right: 20px;
      }

      .deck {
        height: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Black Header Bar -->
    <header class="top-bar">Demma</header>

    <main class="content">
      <!-- Top: title -->
      <div class="left-side">
        <div class="intro">
          <h1>Your Mentor Matches</h1>
          <p class="subtitle">Swipe right to add a mentor to your coffee chat list, or left to pass. <a href="coffee_filtered_page_2.html">Edit your filters</a></p>
        </div>
      </div>

      <!-- Bottom: deck + coffee chat list -->
      <div class="right-side">
        <div class="layout">
          <section class="deck-area" aria-label="Mentor cards">
            <p class="notice" id="notice" hidden></p>

            <div class="deck" id="deck"></div>

            <div class="swipe-controls">
              <button type="button" class="round-btn" id="btn-pass" aria-label="Pass on this mentor">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                </svg>
              </button>
              <button type="button" class="round-btn small" id="btn-undo" aria-label="Undo last swipe">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9 14L4 9l5-5"></path>
                  <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path>
                </svg>
              </button>
              <button type="button" class="round-btn yes" id="btn-chat" aria-label="Add this mentor to your coffee chat list">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="5 12.5 10 17.5 19 7"></polyline>
                </svg>
              </button>
            </div>
            <p class="hint">Drag the card, tap the buttons, or use the &larr; &rarr; arrow keys.</p>
          </section>

          <!-- Coffee chat list -->
          <aside class="panel" aria-labelledby="chat-title">
            <h2 class="panel-title" id="chat-title">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 20.5l1.4-5.1A8.5 8.5 0 1 1 21 11.5z"></path>
                <path d="M8.5 10.5h6v2.5a2.5 2.5 0 0 1-2.5 2.5h-1a2.5 2.5 0 0 1-2.5-2.5z"></path>
                <path d="M14.5 11h.8a1.4 1.4 0 0 1 0 2.8h-.8"></path>
                <line x1="10.3" y1="7.2" x2="10.3" y2="8.6"></line>
                <line x1="12.7" y1="7.2" x2="12.7" y2="8.6"></line>
              </svg>
              Your Coffee Chat List
            </h2>
            <p class="panel-note">Mentors you swiped right on. We'll let them know you'd like to chat.</p>
            <ul class="chat-list" id="chat-list"></ul>
            <div class="panel-actions">
              <button type="button" class="pill-btn outline" id="start-over">Start Over</button>
              <a href="home_student.html" class="pill-btn">Back to Home</a>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <!-- Home -->
      <a href="home_student.html" class="nav-item" aria-label="Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"></path>
          <path d="M10 20v-6h4v6"></path>
        </svg>
      </a>

      <!-- Coffee Chat (this section) -->
      <a href="coffee_filtered_page.html" class="nav-item" aria-label="Coffee Chats" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 20.5l1.4-5.1A8.5 8.5 0 1 1 21 11.5z"></path>
          <path d="M8.5 10.5h6v2.5a2.5 2.5 0 0 1-2.5 2.5h-1a2.5 2.5 0 0 1-2.5-2.5z"></path>
          <path d="M14.5 11h.8a1.4 1.4 0 0 1 0 2.8h-.8"></path>
          <line x1="10.3" y1="7.2" x2="10.3" y2="8.6"></line>
          <line x1="12.7" y1="7.2" x2="12.7" y2="8.6"></line>
        </svg>
      </a>

      <!-- Posts -->
      <a href="post.html" class="nav-item" aria-label="Posts">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"></rect>
          <line x1="8" y1="8" x2="16" y2="8"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="16" x2="13" y2="16"></line>
        </svg>
      </a>

      <!-- Profile -->
      <a href="#" class="nav-item" aria-label="Profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <circle cx="12" cy="9.5" r="2.8"></circle>
          <path d="M7 18.2c1.1-2.3 2.9-3.4 5-3.4s3.9 1.1 5 3.4"></path>
        </svg>
      </a>
    </nav>
  </div>

    // ----- Saved data (shared with coffee_filtered_page.html) -----
    const PREFS_KEY = "demma-coffee-chat-prefs";     // filters from the survey
    const DECISIONS_KEY = "demma-coffee-chat-swipes"; // { mentorId: "chat" | "pass" }

    function load(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; }
      catch (e) { return fallback; }
    }

    function store(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch (e) { /* storage blocked: page still works until reload */ }
    }

    const prefs = load(PREFS_KEY, null);
    let decisions = load(DECISIONS_KEY, {});
    let history = []; // swipes this visit, for Undo

    // ----- Matching: what this mentor has in common with your filters -----
    function overlap(a, b) {
      const lower = (b || []).map(x => x.toLowerCase());
      return (a || []).filter(x => lower.includes(x.toLowerCase()));
    }

    // Careers: a mentor shows up only if they have a career the student picked.
    //  - Careers picked from the list must match the EXACT name (any capitalization),
    //    e.g. "Social Media Management" only matches "Social Media Management".
    //  - Careers the student typed in themselves match by KEYWORDS: every word they
    //    typed must be in the mentor's career, e.g. "social media" matches
    //    "Social Media Management" and "Social Media Marketing".
    function words(text) {
      return text.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    }

    function careerMatches(mentorCareers) {
      const picks = (prefs && prefs.careers) || [];
      const typed = ((prefs && prefs.customCareers) || []).map(c => c.toLowerCase());
      return mentorCareers.filter(mc => picks.some(pick => {
        if (mc.toLowerCase() === pick.toLowerCase()) return true;
        if (!typed.includes(pick.toLowerCase())) return false;
        const mcWords = words(mc);
        return words(pick).every(w => mcWords.includes(w));
      }));
    }

    function matchInfo(m) {
      if (!prefs) return { score: 0, careers: [], goals: [], hobbies: [], major: false, frequency: false, commitment: false };
      const info = {
        careers: careerMatches(m.careers),
        goals: overlap(m.goals, prefs.goals),
        hobbies: overlap(m.hobbies, prefs.hobbies),
        major: m.major === prefs.major,
        frequency: m.frequency === prefs.frequency,
        commitment: m.commitment.toLowerCase() === (prefs.commitment || "").toLowerCase()
      };
      // careers count most, then goals and major/commitment, then the rest
      info.score = info.careers.length * 3 + info.goals.length * 2 + info.hobbies.length
        + (info.major ? 2 : 0) + (info.commitment ? 2 : 0) + (info.frequency ? 1 : 0);
      info.common = info.careers.length + info.goals.length + info.hobbies.length
        + info.major + info.frequency + info.commitment;
      return info;
    }

    // Mentors to show: ONLY ones with a career you picked, best match first.
    // (Major, goals, hobbies, etc. just change the order.)
    // No filters filled out yet -> show everyone.
    const notice = document.getElementById("notice");
    let pool = MENTORS.map(m => ({ ...m, match: matchInfo(m) }));

    if (!prefs) {
      notice.innerHTML = 'Showing all mentors. <a href="coffee_filtered_page.html">Fill out your filters</a> to see your best matches first.';
      notice.hidden = false;
    } else {
      pool = pool.filter(m => m.match.careers.length);
      pool.sort((a, b) => b.match.score - a.match.score);
    }

    // ----- Icons -----
    const AVATAR = '<svg class="avatar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><circle cx="12" cy="9.5" r="2.8"></circle><path d="M7 18.2c1.1-2.3 2.9-3.4 5-3.4s3.9 1.1 5 3.4"></path></svg>';
    const BUILDING = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5"></rect><line x1="9" y1="7" x2="9" y2="7.01"></line><line x1="15" y1="7" x2="15" y2="7.01"></line><line x1="9" y1="11" x2="9" y2="11.01"></line><line x1="15" y1="11" x2="15" y2="11.01"></line><path d="M10 21v-4h4v4"></path></svg>';
    const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>';

    // Safe text for building HTML
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function tags(list, matched) {
      const lower = matched.map(x => x.toLowerCase());
      return list.map(t => `<span class="tag${lower.includes(t.toLowerCase()) ? " match" : ""}">${esc(t)}</span>`).join("");
    }

    // ----- Build one card -----
    function cardHTML(m, isTop) {
      const mi = m.match;
      const badge = prefs ? `<span class="match-badge">${mi.common} of your pick${mi.common === 1 ? "" : "s"}</span>` : "";
      return `
        <article class="profile-card ${isTop ? "top" : "behind"}" data-id="${m.id}"
          ${isTop ? `tabindex="0" aria-label="${esc(m.name)}, ${esc(m.role)}"` : 'aria-hidden="true"'}>
          <span class="stamp yes">COFFEE CHAT</span>
          <span class="stamp no">PASS</span>

          <div class="card-head">
            ${AVATAR}
            <div>
              <h2 class="card-name">${esc(m.name)}</h2>
              <p class="card-role">${esc(m.role)} · ${esc(m.year)}</p>
              <p class="card-company">${BUILDING}<span>${esc(m.company)} · ${m.years} year${m.years === 1 ? "" : "s"}</span></p>
              ${badge}
            </div>
          </div>

          <p class="card-bio">${esc(m.bio)}</p>

          <div class="card-body">
            <div class="card-section">
              <h3>About</h3>
              <div class="facts">
                <span><strong>Major:</strong> ${esc(m.major)}${mi.major ? " &#10003;" : ""}</span>
                <span><strong>Meets:</strong> ${esc(m.frequency)}${mi.frequency ? " &#10003;" : ""}</span>
                <span><strong>Style:</strong> ${esc(m.commitment)}${mi.commitment ? " &#10003;" : ""}</span>
              </div>
            </div>
            <div class="card-section">
              <h3>Careers</h3>
              <div class="tag-row">${tags(m.careers, mi.careers)}</div>
            </div>
            <div class="card-section">
              <h3>Can help you</h3>
              <div class="tag-row">${tags(m.goals, mi.goals)}</div>
            </div>
            <div class="card-section">
              <h3>Hobbies</h3>
              <div class="tag-row">${tags(m.hobbies, mi.hobbies)}</div>
            </div>
          </div>
        </article>`;
    }

    // ----- Draw the deck and the list -----
    const deck = document.getElementById("deck");
    const chatList = document.getElementById("chat-list");
    const btnPass = document.getElementById("btn-pass");
    const btnChat = document.getElementById("btn-chat");
    const btnUndo = document.getElementById("btn-undo");

    function remaining() {
      return pool.filter(m => !decisions[m.id]);
    }

    function render() {
      const left = remaining();
      if (!pool.length) {
        deck.innerHTML = `
          <div class="deck-empty">
            <h2>No mentors yet</h2>
            <p>No mentors work in the careers you picked right now. Try adding more careers to see more mentors.</p>
            <a href="coffee_filtered_page_2.html" class="pill-btn outline">Edit Filters</a>
          </div>`;
      } else if (left.length) {
        // behind card first so the top card sits on top
        deck.innerHTML = (left[1] ? cardHTML(left[1], false) : "") + cardHTML(left[0], true);
        attachDrag(deck.querySelector(".profile-card.top"));
      } else {
        deck.innerHTML = `
          <div class="deck-empty">
            <h2>You've seen everyone!</h2>
            <p>Check your coffee chat list, edit your filters, or start over to see the mentors again.</p>
            <a href="coffee_filtered_page_2.html" class="pill-btn outline">Edit Filters</a>
          </div>`;
      }
      btnPass.disabled = btnChat.disabled = !left.length;
      btnUndo.disabled = !history.length;
      renderList();
    }

    function renderList() {
      const picked = MENTORS.filter(m => decisions[m.id] === "chat");
      if (!picked.length) {
        chatList.innerHTML = '<li class="chat-empty">No mentors yet. Swipe right on someone you\'d like to meet!</li>';
        return;
      }
      chatList.innerHTML = picked.map(m => `
        <li class="chat-item">
          ${AVATAR}
          <span class="chat-info">
            <span class="chat-name">${esc(m.name)}</span>
            <span class="chat-role">${esc(m.role)} at ${esc(m.company)}</span>
          </span>
          <button type="button" class="remove-btn" data-remove="${m.id}" aria-label="Remove ${esc(m.name)} from your list">${X_ICON}</button>
        </li>`).join("");
    }

    // ----- Decide on the top card -----
    let busy = false;

    function decide(choice) {
      const card = deck.querySelector(".profile-card.top");
      if (!card || busy) return;
      busy = true;
      const dir = choice === "chat" ? 1 : -1;
      card.classList.remove("dragging");
      card.querySelector(choice === "chat" ? ".stamp.yes" : ".stamp.no").style.opacity = 1;
      card.style.transform = `translate(${dir * (window.innerWidth + 200)}px, 40px) rotate(${dir * 25}deg)`;
      card.style.opacity = "0";
      setTimeout(() => {
        decisions[card.dataset.id] = choice;
        history.push(card.dataset.id);
        store(DECISIONS_KEY, decisions);
        busy = false;
        render();
        const next = deck.querySelector(".profile-card.top");
        if (next && document.activeElement === document.body) next.focus({ preventScroll: true });
      }, 300);
    }

    // ----- Drag / swipe with mouse or finger -----
    const SWIPE_DISTANCE = 110; // px needed to count as a swipe

    function attachDrag(card) {
      let startX = 0, startY = 0, dx = 0, dragging = false;
      const yes = card.querySelector(".stamp.yes");
      const no = card.querySelector(".stamp.no");

      card.addEventListener("pointerdown", e => {
        if (busy || e.button > 0) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        dx = 0;
        card.setPointerCapture(e.pointerId);
        card.classList.add("dragging");
      });

      card.addEventListener("pointermove", e => {
        if (!dragging) return;
        dx = e.clientX - startX;
        const dy = (e.clientY - startY) * 0.2;
        card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
        yes.style.opacity = Math.max(0, Math.min(1, dx / SWIPE_DISTANCE));
        no.style.opacity = Math.max(0, Math.min(1, -dx / SWIPE_DISTANCE));
      });

      const end = () => {
        if (!dragging) return;
        dragging = false;
        if (dx > SWIPE_DISTANCE) return decide("chat");
        if (dx < -SWIPE_DISTANCE) return decide("pass");
        // not far enough: snap back
        card.classList.remove("dragging");
        card.style.transform = "";
        yes.style.opacity = no.style.opacity = 0;
      };

      card.addEventListener("pointerup", end);
      card.addEventListener("pointercancel", end);
    }

    // ----- Buttons and keys -----
    btnChat.addEventListener("click", () => decide("chat"));
    btnPass.addEventListener("click", () => decide("pass"));

    btnUndo.addEventListener("click", () => {
      if (busy || !history.length) return;
      delete decisions[history.pop()];
      store(DECISIONS_KEY, decisions);
      render();
    });

    document.addEventListener("keydown", e => {
      if (e.target.closest("input, textarea, select")) return;
      if (e.key === "ArrowRight") { e.preventDefault(); decide("chat"); }
      if (e.key === "ArrowLeft") { e.preventDefault(); decide("pass"); }
    });

    // Remove from list -> that mentor goes back into the deck
    chatList.addEventListener("click", e => {
      const btn = e.target.closest("[data-remove]");
      if (!btn) return;
      delete decisions[btn.dataset.remove];
      history = history.filter(id => id !== btn.dataset.remove);
      store(DECISIONS_KEY, decisions);
      render();
    });

    document.getElementById("start-over").addEventListener("click", () => {
      if (Object.keys(decisions).length && !confirm("Clear your coffee chat list and see every mentor again?")) return;
      decisions = {};
      history = [];
      store(DECISIONS_KEY, decisions);
      render();
    });

    render();
  </script>
</body>
</html>
