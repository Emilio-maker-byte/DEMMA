<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demma Find a Match</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f2;
      color: #2b2b2b;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* Black Header Bar (same as home) */
    .top-bar {
      padding: 16px 40px;
      background-color: #2b2b2b;
      color: #ffffff;
      font-family: "Sora", sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    /* Two half-screen containers (same idea as home) */
    .content {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .left-side,
    .right-side {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 40px 100px; /* bottom room for the nav */
    }

    .right-side {
      background-color: #f4f4f4;
    }

    .intro {
      max-width: 480px;
    }

    /* Page heading (same style as get_started.html) */
    h1 {
      font-family: "Sora", sans-serif;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      color: #555555;
      margin-bottom: 28px;
    }

    /* Student cards: one vertical list in a scrolling container */
    .student-list {
      width: 100%;
      max-width: 420px;
      max-height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      border: 1.5px solid #2b2b2b;
      border-radius: 18px;
      background-color: #ffffff;
    }

    .student-card {
      flex-shrink: 0;
    }

    .student-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      border: 1.5px solid #2b2b2b;
      border-radius: 18px;
      background-color: #ffffff;
      transition: background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .student-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .student-name {
      font-size: 16px;
      font-weight: 700;
    }

    .student-detail {
      font-size: 13px;
      color: #555555;
    }

    /* Check / X buttons */
    .choices {
      display: flex;
      gap: 8px;
    }

    .choice {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #2b2b2b;
      border-radius: 50%;
      background-color: #ffffff;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .choice:hover {
      background-color: #f1f1f1;
    }

    .choice svg {
      width: 20px;
      height: 20px;
    }

    button.choice,
    button.update-btn {
      font-family: inherit;
      color: #2b2b2b;
      cursor: pointer;
    }

    .choice:focus-visible,
    .update-btn:focus-visible,
    .next-btn:focus-visible {
      outline: 3px solid #8a8a8a;
      outline-offset: 2px;
    }

    /* Which step a card shows: set by the script as data-state on each card
       (new | waiting | approved | skipped) */
    .pending-box,
    .approved-box {
      display: none;
    }

    .pending-box {
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .approved-box {
      align-items: center;
      gap: 10px;
    }

    .student-card[data-state="waiting"] .choices,
    .student-card[data-state="approved"] .choices {
      display: none;
    }

    .student-card[data-state="waiting"] .pending-box,
    .student-card[data-state="approved"] .approved-box {
      display: flex;
    }

    .student-card[data-state="approved"] {
      box-shadow: 0 0 0 2px #2b2b2b;
    }

    .student-card[data-state="skipped"] {
      opacity: 0.5;
    }

    .student-card[data-state="skipped"] .choice.no {
      background-color: #2b2b2b;
      color: #ffffff;
    }

    /* Small pill button: "Check status" */
    .update-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1.5px solid #2b2b2b;
      border-radius: 999px;
      background-color: #ffffff;
      color: #2b2b2b;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }

    .update-btn:hover {
      background-color: #f1f1f1;
    }

    .update-btn svg {
      width: 14px;
      height: 14px;
    }

    .pending-box {
      gap: 6px;
    }

    .next-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: #2b2b2b;
      color: #ffffff;
      transition: background-color 0.15s ease;
    }

    .next-btn:hover {
      background-color: #3b3b3b;
    }

    .next-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Shared link styling for icon buttons and the big button */
    a.choice,
    a.continue-btn {
      color: inherit;
      text-decoration: none;
      text-align: center;
    }

    a.continue-btn {
      color: #ffffff;
      margin-top: 4px;
    }

    /* Waiting status shown on the waiting page */
    .status.pending {
      color: #555555;
    }

    /* Rounded button (same as get_started.html) */
    .continue-btn {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding: 16px;
      border: none;
      border-radius: 999px;
      background-color: #2b2b2b;
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .continue-btn:hover {
      background-color: #3b3b3b;
    }

    /* Scroll cues: always-visible thin scrollbar + fade at the bottom */
    .student-list::-webkit-scrollbar {
      width: 8px;
    }

    .student-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .student-list::-webkit-scrollbar-thumb {
      background-color: #b5b5b5;
      border-radius: 999px;
    }

    /* Firefox */
    @supports not selector(::-webkit-scrollbar) {
      .student-list {
        scrollbar-width: thin;
        scrollbar-color: #b5b5b5 transparent;
      }
    }

    /* Fade sticks to the bottom while there is more to scroll;
       at the very end it sits over empty space and disappears */
    .student-list::after {
      content: "";
      position: sticky;
      bottom: 0;
      flex-shrink: 0;
      height: 40px;
      margin-top: -14px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #ffffff);
      pointer-events: none;
    }

    /* Bottom Navigation (same pill as home) */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: calc(100% - 40px);
      max-width: 480px;
      /* Floats over the page so both halves reach the bottom edge */
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 10;
      border: 2px solid #2b2b2b;
      border-radius: 999px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 0 18px;
      color: #2b2b2b;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .nav-item + .nav-item {
      border-left: 1.5px solid #2b2b2b;
    }

    .nav-item:hover {
      background-color: #f5f5f5;
    }

    /* Current page in the nav */
    .nav-item[aria-current="page"] {
      background-color: #2b2b2b;
      color: #ffffff;
    }

    /* On phones: stack heading above list, page scrolls normally */
    @media (max-width: 700px) {
      .app-container {
        height: auto;
        min-height: 100vh;
      }

      .content {
        flex-direction: column;
      }

      .left-side,
      .right-side {
        flex: none;
      }

      .left-side {
        padding-bottom: 24px;
      }

      .top-bar,
      .left-side,
      .right-side {
        padding-left: 20px;
        padding-right: 20px;
      }

      .student-list {
        max-width: none;
        max-height: 60vh;
      }
    }
  
    /* "Back to Home" shows once a match is approved */
    .continue-btn[hidden] {
      display: none;
    }

    .reset-link {
      display: block;
      margin: 14px auto 0;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      color: #8a8a8a;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- One page for both roles:
       match.html?role=mentor  -> alumni picking students (Continue goes to mentorship.html)
       match.html?role=student -> students picking mentors (Continue goes to student_mentorship.html) -->
  <div class="app-container">
    <!-- Black Header Bar -->
    <header class="top-bar">Demma</header>

    <main class="content">
      <!-- Left container: heading + subtitle + button -->
      <div class="left-side">
        <div class="intro">
          <h1 id="page-title">Request for Your Future Mentorship</h1>
          <p class="subtitle" id="page-subtitle"></p>
          <a href="#" class="continue-btn" id="back-home" hidden>Back to Home</a>
          <button type="button" class="reset-link" id="reset">Reset demo</button>
        </div>
      </div>

      <!-- Right container: scrollable list (filled in by the script) -->
      <div class="right-side">
        <div class="student-list" id="people-list"></div>
      </div>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="bottom-nav" aria-label="Primary Navigation">
      <!-- Home (link set by the script) -->
      <a href="#" class="nav-item" id="nav-home" aria-label="Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"></path>
          <path d="M10 20v-6h4v6"></path>
        </svg>
      </a>

      <!-- Coffee Chat -->
      <a href="#" class="nav-item" aria-label="Coffee Chats">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 20.5l1.4-5.1A8.5 8.5 0 1 1 21 11.5z"></path>
          <path d="M8.5 10.5h6v2.5a2.5 2.5 0 0 1-2.5 2.5h-1a2.5 2.5 0 0 1-2.5-2.5z"></path>
          <path d="M14.5 11h.8a1.4 1.4 0 0 1 0 2.8h-.8"></path>
          <line x1="10.3" y1="7.2" x2="10.3" y2="8.6"></line>
          <line x1="12.7" y1="7.2" x2="12.7" y2="8.6"></line>
        </svg>
      </a>

      <!-- Posts -->
      <a href="post.html" class="nav-item" aria-label="Posts">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"></rect>
          <line x1="8" y1="8" x2="16" y2="8"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
          <line x1="8" y1="16" x2="13" y2="16"></line>
        </svg>
      </a>

      <!-- Profile -->
      <a href="#" class="nav-item" aria-label="Profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.5"></circle>
          <circle cx="12" cy="9.5" r="2.8"></circle>
          <path d="M7 18.2c1.1-2.3 2.9-3.4 5-3.4s3.9 1.1 5 3.4"></path>
        </svg>
      </a>
    </nav>
  </div>

  <script>
    // ----- Settings for each role (edit names/text here) -----
    const ROLES = {
      // Alumni mentor choosing students
      mentor: {
        title: "Request for Your Future Mentorship",
        subtitle: "Tap the check to request a mentorship, or the X to deny. Remember both have to approve of the mentorship, so check back within 24 hours for an updated response!",
        home: "home_alumni.html",
        next: "mentorship.html",
        people: [
          { id: "emma",    name: "Emma K.",    detail: "Computer Science · Junior" },
          { id: "lorelai", name: "Lorelai G.", detail: "Business · Sophomore" },
          { id: "ryan",    name: "Ryan G.",    detail: "Biology · Senior" },
          { id: "kaiden",  name: "Kaiden C.",  detail: "Graphic Design · Freshman" },
          { id: "sam",     name: "Sam C.",     detail: "Psychology · Junior" }
        ]
      },
      // Student choosing mentors
      student: {
        title: "Find Your Future Mentor",
        subtitle: "Tap the check to request a mentor, or the X to pass. Remember both have to approve of the mentorship, so check back within 24 hours for an updated response!",
        home: "home_student.html",
        next: "student_mentorship.html",
        people: [
          { id: "ricky",  name: "Ricky",     detail: "Software Engineer · Class of 2020" },
          { id: "maya",   name: "Maya T.",   detail: "Marketing Manager · Class of 2019" },
          { id: "jordan", name: "Jordan P.", detail: "Data Analyst · Class of 2021" },
          { id: "priya",  name: "Priya S.",  detail: "UX Designer · Class of 2018" },
          { id: "marcus", name: "Marcus L.", detail: "Nurse Practitioner · Class of 2016" }
        ]
      }
    };

    // Which role? match.html?role=student or ?role=mentor (defaults to mentor)
    const roleName = new URLSearchParams(location.search).get("role") === "student" ? "student" : "mentor";
    const role = ROLES[roleName];
    const STORE_KEY = "demma-match-" + roleName;

    // ----- Remember each card's step in this browser -----
    function loadStates() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
      catch (e) { return {}; }
    }

    function saveStates() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(states)); }
      catch (e) { /* storage blocked: page still works, just won't remember */ }
    }

    let states = loadStates();

    // ----- Icons -----
    const ICON = {
      avatar: '<svg class="avatar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><circle cx="12" cy="9.5" r="2.8"></circle><path d="M7 18.2c1.1-2.3 2.9-3.4 5-3.4s3.9 1.1 5 3.4"></path></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12.5 10 17.5 19 7"></polyline></svg>',
      x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>',
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><polyline points="20 4 20 9 15 9"></polyline></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>'
    };

    // ----- Build one card -----
    function cardHTML(p) {
      return `
        <div class="student-card" id="${p.id}" data-id="${p.id}">
          ${ICON.avatar}
          <div class="student-info">
            <span class="student-name">${p.name}</span>
            <span class="student-detail">${p.detail}</span>
          </div>

          <!-- Step 1: check / X -->
          <div class="choices">
            <button type="button" class="choice yes" data-action="request" aria-label="Request ${p.name}">${ICON.check}</button>
            <button type="button" class="choice no" data-action="skip" aria-label="Skip ${p.name}">${ICON.x}</button>
          </div>

          <!-- Step 2: waiting -->
          <div class="pending-box">
            <span class="status pending">Waiting for response...</span>
            <button type="button" class="update-btn" data-action="check">${ICON.refresh}Check status</button>
          </div>

          <!-- Step 3: approved -->
          <div class="approved-box">
            <span class="status approved-text">Approved!</span>
            <a href="${role.next}?with=${encodeURIComponent(p.name)}" class="next-btn" aria-label="Continue with ${p.name}">${ICON.chevron}</a>
          </div>
        </div>`;
    }

    // ----- Draw the page -----
    const list = document.getElementById("people-list");

    function render() {
      list.innerHTML = role.people.map(cardHTML).join("");
      list.querySelectorAll(".student-card").forEach(card => {
        card.dataset.state = states[card.dataset.id] || "new";
      });
      document.getElementById("back-home").hidden = !Object.values(states).includes("approved");
    }

    document.title = "Demma " + role.title;
    document.getElementById("page-title").textContent = role.title;
    document.getElementById("page-subtitle").textContent = role.subtitle;
    document.getElementById("back-home").href = role.home;
    document.getElementById("nav-home").href = role.home;

    // ----- Button clicks: check -> waiting, Check status -> approved, X -> skip/unskip -----
    list.addEventListener("click", e => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const id = btn.closest(".student-card").dataset.id;
      const current = states[id] || "new";
      const next = {
        request: "waiting",
        check: "approved",              // simulated: the other person said yes
        skip: current === "skipped" ? "new" : "skipped"
      }[btn.dataset.action];
      states[id] = next;
      saveStates();
      render();
    });

    document.getElementById("reset").addEventListener("click", () => {
      states = {};
      saveStates();
      render();
    });

    render();
  </script>
</body>
</html>
